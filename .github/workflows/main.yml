name: Build Zegar Trzeźwości APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZegarTrzezwosci_CzystyProjekt.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check ZIP file
        run: |
          ls -la
          find . -maxdepth 1 -type f -name '*.zip' -print

      - name: Extract project
        run: |
         mkdir android-project
           ls -la
          find . -maxdepth 1 -type f -name '*.zip' -print
          unzip -o "$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)" -d android-project

      - name: Find Gradle project
        run: |
          PROJECT_DIR="$(dirname "$(find android-project -type f -name settings.gradle.kts -o -name settings.gradle | head -n 1)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Nie znaleziono pliku settings.gradle.kts ani settings.gradle."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zegar-Trzezwosci-APK
          path: android-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
