
name: Build Zegar Trzeźwości APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZegarTrzezwosci_CzystyProjekt.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir android-project
          unzip ZegarTrzezwosci_CzystyProjekt.zip -d android-project
          find android-project -name gradlew -type f

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: android-project/ZegarTrzezwosci
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZegarTrzezwosci-APK
          path: android-project/ZegarTrzezwosci/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
